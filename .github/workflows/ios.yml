name: iOS build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    env:
      SCHEME: K3RNIntel
      # These are non-secret; override via repo Variables if they differ.
      SUPABASE_HOST: ${{ vars.SUPABASE_HOST || 'eokucxysugglijyvhbdy.supabase.co' }}
      DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID || '1511533461650014350' }}
      DISCORD_OFFICER_ROLE_ID: ${{ vars.DISCORD_OFFICER_ROLE_ID || '1511533461675053086' }}
      DISCORD_K3RN_ROLE_ID: ${{ vars.DISCORD_K3RN_ROLE_ID || '1511533461666795578' }}
      # On pull_request, github.sha is the ephemeral merge commit — the head sha is
      # what a tester can actually match against the branch.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write Secrets.xcconfig
        run: |
          mkdir -p Config
          cat > Config/Secrets.xcconfig <<EOF
          SUPABASE_HOST = ${SUPABASE_HOST}
          SUPABASE_ANON_KEY = ${{ secrets.SUPABASE_ANON_KEY }}
          DISCORD_GUILD_ID = ${DISCORD_GUILD_ID}
          DISCORD_OFFICER_ROLE_ID = ${DISCORD_OFFICER_ROLE_ID}
          DISCORD_K3RN_ROLE_ID = ${DISCORD_K3RN_ROLE_ID}
          DEVELOPMENT_TEAM =
          GIT_SHA = ${HEAD_SHA:0:7}
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      # Unsigned device build -> repackage the .app as a .ipa for Sideloadly.
      # Sideloadly re-signs with your Apple ID, so no signing secrets are needed here.
      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project K3RNIntel.xcodeproj \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -archivePath build/K3RNIntel.xcarchive \
            SWIFT_OPTIMIZATION_LEVEL=-Onone SWIFT_COMPILATION_MODE=singlefile \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned .ipa
        run: |
          cd build
          rm -rf Payload
          mkdir -p Payload
          cp -R K3RNIntel.xcarchive/Products/Applications/*.app Payload/
          zip -qry K3RNIntel-unsigned.ipa Payload
          ls -lh K3RNIntel-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: K3RNIntel-unsigned-ipa-${{ github.ref_name }}-${{ github.run_number }}
          path: ios/build/K3RNIntel-unsigned.ipa
          if-no-files-found: error
