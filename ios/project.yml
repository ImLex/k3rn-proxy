name: K3RNIntel
options:
  bundleIdPrefix: site.k3rn
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    # 2.49.0 is the last release supporting iOS 13/15; 2.50.0+ require iOS 16,
    # which would break installs on the target iOS 15.8 device.
    exactVersion: "2.49.0"

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

targets:
  K3RNIntel:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.k3rn.intel
        PRODUCT_NAME: K3RN Intel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
